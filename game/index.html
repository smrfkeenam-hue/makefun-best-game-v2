<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEAMWARD — Lay the track before the train does</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0e1f16;
    height: 100%;
    overflow: hidden;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #game {
    display: block;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    background: #0e1f16;
    cursor: pointer;
    touch-action: none;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="STEAMWARD game board"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
